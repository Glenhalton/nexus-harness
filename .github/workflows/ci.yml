name: CI/CD

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    name: Build & Verify Harness Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build libraries
        run: pnpm run build:lib

      - name: Build Web Frontend
        run: pnpm run build:web

      - name: Package @nexus-framework/harness
        run: pnpm run package:harness

      - name: Smoke test packed tarball in a temporary global prefix
        run: |
          PREFIX="$(mktemp -d)"
          (cd apps/nexus-harness && npm pack --pack-destination "$PREFIX")
          npm i -g --prefix "$PREFIX" --no-audit --no-fund "$PREFIX"/nexus-framework-harness-*.tgz
          "$PREFIX/bin/nexus-harness" --version
          "$PREFIX/bin/nexus-code" --help
          "$PREFIX/bin/nexus" --version

  publish:
    name: Publish @nexus-framework/harness to npm
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version needs publishing
        id: version
        run: |
          CURRENT=$(node -p "require('./apps/nexus-harness/package.json').version")
          PKG_NAME=$(node -p "require('./apps/nexus-harness/package.json').name")
          PUBLISHED=$(npm view "$PKG_NAME@$CURRENT" version 2>/dev/null || echo "")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
          if [ "$PUBLISHED" != "$CURRENT" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📦 $PKG_NAME@$CURRENT is not on npm — publishing"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️ $PKG_NAME@$CURRENT already on npm — skipping publish"
          fi

      - name: Setup pnpm
        if: steps.version.outputs.changed == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build and Package
        if: steps.version.outputs.changed == 'true'
        run: |
          pnpm run build:lib
          pnpm run build:web
          pnpm run package:harness

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        working-directory: apps/nexus-harness
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create git tag
        if: steps.version.outputs.changed == 'true'
        run: |
          VERSION=${{ steps.version.outputs.current }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release @nexus-framework/harness v$VERSION"
          git push origin "v$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.current }}
          name: @nexus-framework/harness v${{ steps.version.outputs.current }}
          body: |
            ## @nexus-framework/harness v${{ steps.version.outputs.current }}

            The official AI-Native Execution Harness and Web Interface for NEXUS.

            ### Run via NEXUS CLI:
            ```bash
            nexus harness
            ```

            ### Or on-demand via npx:
            ```bash
            npx -y @nexus-framework/harness web --port 3080
            ```

            📦 [npm](https://www.npmjs.com/package/@nexus-framework/harness/v/${{ steps.version.outputs.current }})
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
